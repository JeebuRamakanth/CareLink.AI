name: Web quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Test CareLink AI backend safety and UI wiring
        run: node --test supabase/functions/ai-chat/ai-chat.test.mjs
